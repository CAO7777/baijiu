<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员登录</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: grid; place-items: center; min-height: 90vh; background-color: #FAF8F5; color: #2A1B1B; }
        form { background: #fff; border: 1px solid #E9E3DA; border-radius: 16px; padding: 24px; box-shadow: 0 8px 25px rgba(110,15,26,.08); width: 320px; }
        h1 { font-family: "Noto Serif SC", serif; text-align: center; color: #6E0F1A; margin-top: 0; }
        div { margin-bottom: 16px; }
        label { display: block; font-size: 13px; color: #7B6363; margin-bottom: 6px; }
        input { width: 100%; box-sizing: border-box; border: 1px solid #E9E3DA; border-radius: 12px; padding: 10px 12px; }
        button { width: 100%; background: linear-gradient(135deg, #6E0F1A, #560B13); color: #fff; border: none; padding: 12px; border-radius: 12px; font-weight: 700; cursor: pointer; }
        .error { background: #fff1ef; border: 1px solid #f5c2c0; color: #8b2a20; border-radius: 8px; padding: 10px; font-size: 13px; text-align: center; }
    </style>
</head>
<body>
    <form method="POST" action="{{ url_for('admin_login') }}">
        <h1>后台登录</h1>
        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}
        <div>
            <label for="email">账号</label>
            <input type="email" id="email" name="email" value="guanliyuan@qq.com" required>
        </div>
        <div>
            <label for="password">密码</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit">登 录</button>
    </form>
</body>
</html>
