<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员登录</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg); }
        .login-panel { width: min(400px, 90vw); }
        .login-panel .brand { justify-content: center; margin-bottom: 20px; }
        .login-panel h1 { text-align: center; font-size: 24px; }
        .login-panel form { display: flex; flex-direction: column; gap: 16px; }
        .error { color: var(--burgundy); background: rgba(110, 15, 26, 0.08); padding: 10px; border-radius: 8px; text-align: center; }
    </style>
</head>
<body>
    <div class="panel login-panel">
        <div class="brand">
            <div class="monogram">酿</div>
            <div class="brand-text"><span>管理后台</span><em>Admin Login</em></div>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="error">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="{{ url_for('admin_login') }}" method="POST">
            <label class="field">
                <span>用户名</span>
                <input type="text" name="username" required>
            </label>
            <label class="field">
                <span>密码</span>
                <input type="password" name="password" required>
            </label>
            <button type="submit" class="btn primary" style="margin-top: 10px;">登录</button>
        </form>
    </div>
</body>
</html>
